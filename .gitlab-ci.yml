stages:
  - verify
  - resources

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME == "codex/reorg-original-20261009"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME == "codex/reorg-unity-20261009"'
    - if: '$CI_COMMIT_BRANCH == "codex/reorg-original-20261009" && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH == "codex/reorg-original-20261009"'
    - if: '$CI_COMMIT_BRANCH == "codex/reorg-unity-20261009" && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH == "codex/reorg-unity-20261009"'
    # Feature-branch Python tooling only. The two long-lived branches are
    # already decided above. An open merge request suppresses the branch
    # pipeline so the same commit is not tested twice.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "codex/reorg-original-20261009"'
      changes: &python_tooling_changes
        - modern/tools/**/*
        - modern/tests/unit/tools/**/*
        - scripts/check-project-governance.py
        - .gitlab-ci.yml
        - reference/manifests/**/*
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_COMMIT_BRANCH != "codex/reorg-original-20261009" && $CI_COMMIT_BRANCH != "codex/reorg-unity-20261009"'
      when: never
    - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != "codex/reorg-original-20261009" && $CI_COMMIT_BRANCH != "codex/reorg-unity-20261009"'
      changes: *python_tooling_changes
    - when: never

variables:
  # Only resource jobs request LFS payloads during the Runner checkout.
  GIT_LFS_SKIP_SMUDGE: "1"
  PYTHONDONTWRITEBYTECODE: '1'

.linux_trusted:
  image: python:3.12-alpine3.22@sha256:a190708a2dec1bd18b1decb539f8e8f5407abaa9bf39cacda583f7f8c11db322
  tags:
    - docker
    - linux
    - trusted

original_governance_and_python_tests:
  extends: .linux_trusted
  stage: verify
  rules:
    - if: '$CI_COMMIT_BRANCH == "codex/reorg-original-20261009"'
    - if: '$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME == "codex/reorg-original-20261009"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "codex/reorg-original-20261009" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME != "codex/reorg-unity-20261009"'
      changes: *python_tooling_changes
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_COMMIT_BRANCH != "codex/reorg-original-20261009" && $CI_COMMIT_BRANCH != "codex/reorg-unity-20261009"'
      when: never
    - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != "codex/reorg-original-20261009" && $CI_COMMIT_BRANCH != "codex/reorg-unity-20261009"'
      changes: *python_tooling_changes
  script:
    - python3 --version
    - python3 scripts/check-project-governance.py
    - python3 -B -m unittest modern/tests/unit/tools/test_unpack_pak.py
    - python3 -B -m unittest modern/tests/unit/tools/test_pak_writer.py
    - python3 -B -m unittest modern/tests/unit/tools/test_resource_profile.py
    - python3 -B -m unittest modern/tests/unit/tools/test_resource_reference_gate.py

original_lfs_integrity:
  extends: .linux_trusted
  stage: resources
  variables:
    # Runner helper fetches LFS using its job credentials and trusted CA.
    GIT_LFS_SKIP_SMUDGE: "0"
  rules:
    - if: '$CI_COMMIT_BRANCH == "codex/reorg-original-20261009"'
    - if: '$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME == "codex/reorg-original-20261009"'
  script:
    - python3 scripts/verify-resource-profile.py reference/manifests/playdh-current.sha256.json --root modern/data/PlayDH --profile-id playdh-current --full --exact

# Warn-only extension of the MxhResourceReference gate. Exit 0 until
# MXH_RESOURCE_REF_STRICT=1. Does not fetch LFS and does not read original
# .map/.stm bytes; those are derived on ROG into the checked-in manifest.
original_resource_reference_warn:
  extends: .linux_trusted
  stage: verify
  rules:
    - if: '$CI_COMMIT_BRANCH == "codex/reorg-original-20261009"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "codex/reorg-original-20261009"'
  script:
    - python3 -B -m unittest modern/tests/unit/tools/test_resource_reference_gate.py
    - python3 modern/tools/resource_reference_gate.py check --manifest reference/manifests/original-resource-references.json --root modern/data/PlayDH --report ci-resource-reference-report.json --codequality ci-resource-reference-codequality.json
  artifacts:
    when: always
    paths:
      - ci-resource-reference-report.json
    reports:
      codequality: ci-resource-reference-codequality.json

unity_governance_and_python_tests:
  extends: .linux_trusted
  stage: verify
  rules:
    - if: '$CI_COMMIT_BRANCH == "codex/reorg-unity-20261009"'
    - if: '$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME == "codex/reorg-unity-20261009"'
  script:
    - python3 --version
    - python3 scripts/check-project-governance.py
    - python3 -B -m unittest discover -s modern/tests/unit/tools -p test_unity_resource_audit.py
    - python3 -B -m unittest discover -s modern/tests/unit/tools -p test_unity_terrain_palette.py
    - python3 -B -m unittest modern/tests/unit/tools/test_resource_profile.py

unity_lfs_and_source_integrity:
  extends: .linux_trusted
  stage: resources
  variables:
    # Runner helper fetches LFS using its job credentials and trusted CA.
    GIT_LFS_SKIP_SMUDGE: "0"
  rules:
    - if: '$CI_COMMIT_BRANCH == "codex/reorg-unity-20261009"'
    - if: '$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME == "codex/reorg-unity-20261009"'
  script:
    - python3 scripts/verify-resource-profile.py unity/dependencies/effekseer-1.80.7.files.json --root unity/MoxiangClient/Assets/Effekseer --profile-id effekseer-1.80.7 --full --exact
    - python3 scripts/verify-resource-profile.py reference/manifests/playdh-current.sha256.json --root modern/data/PlayDH --profile-id playdh-current --full --exact
    - python3 modern/tools/unity_resource_audit.py verify-source unity/baselines/playdh-current.json.gz modern/data/PlayDH --additional-root recovered-map=unity/source-overlays/unity-remaster-v1/recovered-originals/PlayDH

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 720" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0a0807"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%"   stop-color="#c9a76a" stop-opacity="0.4"/>
      <stop offset="60%"  stop-color="#c9a76a" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#c9a76a" stop-opacity="0.0"/>
    </radialGradient>
    <linearGradient id="title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#8a6d3a"/>
      <stop offset="50%"  stop-color="#c9a76a"/>
      <stop offset="100%" stop-color="#8a6d3a"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="720" fill="url(#bg)"/>
  <rect width="1920" height="720" fill="url(#glow)"/>
  <g transform="translate(960, 360)">
    <text text-anchor="middle" font-family="'Noto Serif SC', serif" font-size="180" font-weight="700" fill="url(#title)" letter-spacing="20">墨香</text>
    <text y="120" text-anchor="middle" font-family="'Noto Sans SC', sans-serif" font-size="32" fill="#a89a7a">经典 2D MMORPG · 1:1 现代复刻</text>
  </g>
  <g opacity="0.3">
    <circle cx="200"  cy="180" r="2" fill="#c9a76a"/>
    <circle cx="400"  cy="540" r="2" fill="#c9a76a"/>
    <circle cx="1600" cy="200" r="2" fill="#c9a76a"/>
    <circle cx="1700" cy="600" r="2" fill="#c9a76a"/>
    <circle cx="900"  cy="120" r="2" fill="#a8324a"/>
    <circle cx="1100" cy="640" r="2" fill="#a8324a"/>
  </g>
</svg>

  gitleaks_tree_scan:
    runs-on: ubuntu-latest
    container:
      image: python:3.12-alpine3.22@sha256:a190708a2dec1bd18b1decb539f8e8f5407abaa9bf39cacda583f7f8c11db322
    defaults:
      run:
        shell: sh
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      GIT_LFS_SKIP_SMUDGE: "1"
    steps:
      - name: Checkout pull request merge ref
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # 容器里没有默认的 GITHUB_TOKEN。只注入到本步环境，askpass 按变量名读取。
          # 脚本用单引号写入 "$GITHUB_TOKEN"，不展开、不 echo，日志里不会出现令牌值。
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          apk add --no-cache git ca-certificates
          git init
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          askpass=$(mktemp)
          printf '%s\n' '#!/bin/sh' 'case "$1" in' '*Username*) printf "%s\n" x-access-token ;;' '*) printf "%s\n" "$GITHUB_TOKEN" ;;' 'esac' > "$askpass"
          chmod 700 "$askpass"
          if [ -n "$PR_NUMBER" ]; then
            refspec="+refs/pull/${PR_NUMBER}/merge:refs/remotes/origin/pr"
            GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 git fetch --depth 1 origin "$refspec"
            rm -f "$askpass"
            git checkout --detach refs/remotes/origin/pr
          else
            GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 git fetch --depth 1 origin "$GITHUB_SHA"
            rm -f "$askpass"
            git checkout --detach FETCH_HEAD
          fi

      - name: gitleaks_tree_scan
        run: |
          set -eu
          gitleaks_dir="$(mktemp -d)"
          tarball="${gitleaks_dir}/gitleaks_8.30.1_linux_x64.tar.gz"
          python3 - "$tarball" <<'PY'
          import hashlib, pathlib, sys, urllib.request
          dest = pathlib.Path(sys.argv[1])
          url = "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          expected = "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          urllib.request.urlretrieve(url, dest)
          digest = hashlib.sha256(dest.read_bytes()).hexdigest()
          if digest != expected:
              raise SystemExit("gitleaks sha256 mismatch")
          PY
          tar -xzf "${tarball}" -C "${gitleaks_dir}"
          chmod +x "${gitleaks_dir}/gitleaks"
          status=0
          python3 scripts/gitleaks-selftest.py --gitleaks "${gitleaks_dir}/gitleaks" --config .gitleaks.toml || status=1
          python3 scripts/gitleaks-selftest.py --check-paks . || status=1
          python3 scripts/gitleaks-selftest.py --gitleaks "${gitleaks_dir}/gitleaks" --config .gitleaks.toml --scan . || status=1
          exit "$status"

  # Report-only. Not a required check. continue-on-error keeps findings from
  # failing the workflow. Becomes required after history cleanup (owner-only).
  gitleaks_history:
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      GIT_LFS_SKIP_SMUDGE: "1"
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: gitleaks_history
        run: |
          set -eu
          gitleaks_dir="$(mktemp -d)"
          tarball="${gitleaks_dir}/gitleaks_8.30.1_linux_x64.tar.gz"
          python3 - "$tarball" <<'PY'
          import hashlib, pathlib, sys, urllib.request
          dest = pathlib.Path(sys.argv[1])
          url = "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          expected = "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          urllib.request.urlretrieve(url, dest)
          digest = hashlib.sha256(dest.read_bytes()).hexdigest()
          if digest != expected:
              raise SystemExit("gitleaks sha256 mismatch")
          PY
          tar -xzf "${tarball}" -C "${gitleaks_dir}"
          chmod +x "${gitleaks_dir}/gitleaks"
          report="$(mktemp)"
          stdout="$(mktemp)"
          stderr="$(mktemp)"
          cleanup() { rm -f "$report" "$stdout" "$stderr"; }
          trap cleanup EXIT
          set +e
          "${gitleaks_dir}/gitleaks" git . \
            --config .gitleaks.toml \
            --redact=100 \
            --no-banner \
            --log-level error \
            --report-format json \
            --report-path "$report" \
            --exit-code 2 \
            >"$stdout" 2>"$stderr"
          rc=$?
          set -e
          python3 - "$report" "$rc" <<'PY'
          import json, re, sys
          from collections import Counter
          from pathlib import Path

          report = Path(sys.argv[1])
          rc = int(sys.argv[2])
          rule_id = re.compile(r"[A-Za-z0-9][A-Za-z0-9_.-]{0,80}")
          data = None
          if report.is_file() and report.stat().st_size:
              try:
                  data = json.loads(report.read_text(encoding="utf-8"))
              except json.JSONDecodeError:
                  data = None
          if data is None and rc == 0:
              data = []
          if not isinstance(data, list):
              print(f"GITLEAKS_HISTORY SCAN_ERROR exit={rc}", file=sys.stderr)
              raise SystemExit(1)
          counts = Counter()
          for item in data:
              if not isinstance(item, dict):
                  rule = "unknown"
              else:
                  rule = item.get("RuleID")
                  if not isinstance(rule, str) or rule_id.fullmatch(rule) is None:
                      rule = "unknown"
              counts[rule] += 1
          total = sum(counts.values())
          print(f"GITLEAKS_HISTORY REPORT_ONLY findings={total}")
          for rule in sorted(counts):
              print(f"GITLEAKS_HISTORY RULE {rule} count={counts[rule]}")
          if rc not in (0, 2):
              print(f"GITLEAKS_HISTORY SCAN_ERROR exit={rc}", file=sys.stderr)
              raise SystemExit(1)
          PY

  # playdh_baseline_check
  # Compares modern/data/PlayDH to playdh-current.sha256.json. LFS files stay
  # pointer files: oid and size are compared, and this job does not download
  # LFS objects. decodedMaps sha256 values are original obfuscated .map hashes.
  # Any PR that changes playdh-current.sha256.json must state that it was
  # approved by 战略专家.
  playdh_baseline_check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request merge ref
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          set -euo pipefail
          command -v git
          git init
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          askpass=$(mktemp)
          printf '%s\n' '#!/bin/sh' 'case "$1" in' '*Username*) printf "%s\n" x-access-token ;;' '*) printf "%s\n" "$GITHUB_TOKEN" ;;' 'esac' > "$askpass"
          chmod 700 "$askpass"
          if [ -n "$PR_NUMBER" ]; then
            refspec="+refs/pull/${PR_NUMBER}/merge:refs/remotes/origin/pr"
            GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 git fetch --depth 1 origin "$refspec"
            git checkout --detach refs/remotes/origin/pr
          else
            GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 git fetch --depth 1 origin "$GITHUB_SHA"
            git checkout --detach FETCH_HEAD
          fi
          rm -f "$askpass"

      - name: playdh_baseline_self_test
        run: python3 scripts/playdh_baseline_check.py --self-test

      - name: playdh_baseline_check
        run: python3 scripts/playdh_baseline_check.py --check

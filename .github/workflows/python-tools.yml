# 与 GitLab CI 保持同步（见 .gitlab-ci.yml）。改脚本、镜像或 paths 时，两边一起改。
#
# original_governance_and_python_tests
# - pull_request 且目标分支为 codex/reorg-original-20261009。
#   paths 与该 job 的 changes（锚点 python_tooling_changes）同一组，并加上本文件。
#   GitLab 写成 **/*；GitHub 用 ** 即可匹配子目录。
# - push 到 codex/reorg-original-20261009 没有 paths 过滤，对应
#   CI_COMMIT_BRANCH == 该分支时无 changes 也会跑。
# - 镜像与 .linux_trusted 的 image 字段逐字相同，含 digest。
# - 该 job 没有 before_script。测试步骤的命令与 script 逐字一致。
# - 顶层 variables PYTHONDONTWRITEBYTECODE=1、GIT_LFS_SKIP_SMUDGE=1 同样设置。
#
# original_resource_reference_warn
# - GitLab rules：该分支的流水线，以及目标分支为该分支的 merge request。没有 changes 过滤。
#   GitHub 的 pull_request.paths 作用到整个 workflow，不能只过滤其中一个 job，
#   所以 pull_request 上这个 job 与上面的 paths 一起触发。
#   push 到 codex/reorg-original-20261009 没有 paths 过滤，对应 CI_COMMIT_BRANCH 规则。
# - 镜像同样钉 .linux_trusted 的 digest。命令与 script 逐字一致。
# - 该 job 没有 allow_failure。只警告来自工具：未设置 MXH_RESOURCE_REF_STRICT 时
#   check 的退出码为 0；MXH_RESOURCE_REF_STRICT=1 或 --strict 才把缺失或无结论变成失败。
#   这里不设置该变量，也不使用 continue-on-error。continue-on-error 会把 unittest 失败
#   一并放过去，和 GitLab 不一致。GitLab 若写成 allow_failure: true，才对应
#   continue-on-error: true。
# - check 与单元测试拆成两步。check 的命令和参数与 GitLab script 逐字相同，
#   单独一步且 if: always()，单元测试失败时这一步仍会跑。退出码仍由 check 自己决定。
#   original_governance_and_python_tests 也用同一步跑同一条 check，方便两边日志都有结果。
#   GitLab 的 script 不拆步，命令文本不变。
# - GitLab artifacts / codequality 不在这里上传：job 在 Alpine 容器内，不能跑
#   需要 glibc Node 的 upload-artifact。
#
# Alpine 是 musl，跑不了 GitHub 注入的 glibc Node。checkout 不用 actions/checkout，
# 只在容器里装 git。pull_request 拉 merge ref；push 按 GITHUB_SHA 取本次提交，
# 避免连续合并时拉到分支尖上后一个提交。这不是 GitLab script 的一部分。
#
# rog_gate_self_test
# - 与 GitLab job rog_gate_self_test 同步。image 含 digest，script 命令逐字相同。
# - 镜像是 mcr.microsoft.com/devcontainers/base:2.1.8-ubuntu24.04 的 linux/amd64
#   manifest（index digest 为
#   sha256:7ee7da33a68d997971660d91ecc8372e55a38a777c3c6bd6808daf91928052db）。
#   镜像里已有 git、curl、sha256sum 和 /bin/sleep。官方 PowerShell 7.6.9
#   linux-x64 tar.gz 下载后按发行版 hashes.sha256 校验再解压。不跑 apt，
#   也不拉未固定的包。
# - 不用 MCR powershell:7.5-ubuntu-24.04
#   （sha256:042240d57ec9e47e511033b92625a8d95875ee5860af3015992c248b58a8be81）：
#   该 tag 仍是 7.5.0-preview.5，且没有 git。
# - 校验后的命令是：
#     pwsh -NoProfile -File scripts/rog-gate-build.ps1 -SelfTest
#     pwsh -NoProfile -File scripts/rog-gate-build.ps1 -SelfTest -SelfTestNoLinks
#     pwsh -NoProfile -File scripts/tests/test-commercial-smoke-mssql-e2e.ps1
#     pwsh -NoProfile -File scripts/tests/test-gui-client-smoke-ephemeral.ps1
#     pwsh -NoProfile -File scripts/tests/test-deploy-default-map.ps1
#     pwsh -NoProfile -File scripts/tests/test-soak-24h.ps1
#     pwsh -NoProfile -File scripts/tests/test-forbidden-rog-ports.ps1
#     pwsh -NoProfile -File deploy/scripts/deploy_client.ps1 -SelfTest
#     pwsh -NoProfile -File scripts/tests/test-deploy-client-playdh-root.ps1
#   任一 FAIL 都会让 pwsh 非零退出。Linux 容器里的符号链接不在 ROG Windows 上创建。
#   第三条是 commercial-smoke 的 LocalDB 可用性脚本测试，加在这个已有的 pwsh job 上。
#   第四条是 gui-client-smoke 的 ephemeral 安全检查，加在同一个 pwsh job 上。
#   第五条核对 start_modern.ps1 的 --default-map 与 map 进程的 --map 都是 $MapNumber，加在同一个 pwsh job 上。
#   第六条是 24h soak harness 的 Linux stub 测试，加在同一个 pwsh job 上。
#   紧跟第六条的是 ROG 端口表合成测试：禁止 16001/17001/18001 与 36001/37001/38001，
#   允许 26001/27001/28001，缺省 Map12Port 必须失败。不启动服务器、不连网络。
#   第七条是 deploy_client.ps1 的 PlayDH 派生路径排除自测，只用 runner 临时目录里的合成文件。
#   下一条是 deploy_client.ps1 在未设置 MXH_PLAYDH_ROOT 且未给 -ResourceDir 时必须失败。
#   用例名是 PLAYDH_ROOT_CASE，不使用 rog 标签。
# - 不删除、不放宽现有 job。#49 加进 paths / python_tooling_changes 的 smoke 脚本保留。
# - rules 与 original_governance_and_python_tests 相同。GitHub checkout 不是
#   GitLab script 的一部分；这个镜像自带 git，不调用 apk，也不用 actions/checkout。
#
# cxx_resource_reference_linux
# - 与 GitLab job cxx_resource_reference_linux 同步。image 含 digest，命令相同。
#   checkout 与 rog_gate_self_test 逐字相同。不设置 MXH_PLAYDH_ROOT。
# - These two tests compare 16 + 3 committed PlayDH files (size + sha256, arrays in
#   modern/tests/unit/compat/resource_reference_test.cpp) under
#   modern/data/PlayDH/Resource. They read no LFS .pak (only
#   Map/Character/Effect/monster.pak are LFS), so LFS skip-smudge is safe.
# - Required-Passed also includes SyntheticFixtureCompareLoopDetectsMatchAndMismatches.
#   The same build runs mxh_agent_cli_tests, mxh_e2e_soak_tests,
#   mxh_dpi_scale_tests, mxh_session_retry_contract_tests,
#   mxh_audio_contract_tests, mxh_item_protocol_tests,
#   mxh_protocol_hash_tests, and mxh_login_protocol_gate_tests. Required-Passed
#   includes AgentCli.OmittedDefaultMapIs17, the extra-map AgentCli cases, the
#   E2eSoak report-peer-gone cases, the DpiScale cases, the
#   SessionRetryContract login/session cases, the AudioContract cases,
#   the ItemProtocol cases, the ProtocolHash cases, and the
#   LoginProtocolGate cases.
#   The ctest regex matches the GitLab job.
#   The summary grep is `(^|[^0-9])0 tests failed` so `10 tests failed` cannot match.
# - pull_request.paths 作用到整个 workflow。下面额外的 C++ paths 会让本文件里的
#   其他 job 在这些路径上一起触发。GitLab 不把这些路径并进 python_tooling_changes。
#
# gitleaks_tree_scan
# - 与 GitLab job gitleaks_tree_scan 同步。镜像是 .linux_trusted 的 digest。
#   不拉 gitleaks 的 :latest，也不需要密钥。
# - GIT_LFS_SKIP_SMUDGE=1。扫的是本次检出的工作树（gitleaks dir），不扫 git 历史。
# - 下载 gitleaks 8.30.1 linux_x64 发行包，用 sha256 校验后再解压。
# - 先跑 scripts/gitleaks-selftest.py（样本写在仓库外的临时目录）。
#   然后检查每个已跟踪的 *.pak。不是 Git LFS pointer 的打印
#   NON_LFS_PAK <path> bytes=<n>，不打印文件内容，并且失败。
#   报告只打印 rule id 和 path:line，并带 --redact=100。
# - rules 与 original_governance_and_python_tests 相同。
#
# gitleaks_history
# - Report-only full-history scan. Not a GitLab job and not a required check.
#   continue-on-error: true. Becomes required after history cleanup (owner-only).
# - actions/checkout fetch-depth: 0 so `gitleaks git` sees full history. The
#   Alpine jobs stay depth 1 and still scan the working tree only.
# - Same pinned gitleaks 8.30.1 linux_x64 tarball and sha256 as gitleaks_tree_scan.
#   `gitleaks git` with --redact=100. The log prints
#   GITLEAKS_HISTORY REPORT_ONLY findings=N and per-rule counts only.
#   Secret values, match text, and excerpts are not printed. GIT_LFS_SKIP_SMUDGE=1.

name: original_governance_and_python_tests

on:
  pull_request:
    branches: [codex/reorg-original-20261009]
    paths:
      - modern/tools/**
      - modern/tests/unit/tools/**
      - scripts/check-project-governance.py
      - scripts/check-no-pak-changes.py
      - scripts/check-ps1-encoding.py
      - scripts/playdh_baseline_check.py
      - scripts/rog-gate-build.ps1
      - scripts/clean-deploy.ps1
      - scripts/commercial-smoke.ps1
      - scripts/rog-gate-build.cmd
      - scripts/clean-deploy.cmd
      - scripts/gui-client-smoke.ps1
      - scripts/gui-client-smoke-ephemeral.ps1
      - scripts/tests/test-gui-client-smoke-ephemeral.ps1
      - scripts/tests/test-commercial-smoke-mssql-e2e.ps1
      - scripts/soak-24h.ps1
      - scripts/soak-24h.cmd
      - scripts/tests/test-soak-24h.ps1
      - scripts/tests/test-forbidden-rog-ports.ps1
      - scripts/tests/test-deploy-default-map.ps1
      - scripts/tests/test-deploy-client-playdh-root.ps1
      - deploy/scripts/start_modern.ps1
      - deploy/scripts/deploy_client.ps1
      - deploy/scripts/deploy_server.ps1
      - deploy/scripts/playdh_package_guard.ps1
      - scripts/protocol_manifest_gate.ps1
      - .gitignore
      - "**.[Pp][Aa][Kk]"
      - .gitlab-ci.yml
      - .github/workflows/python-tools.yml
      - .gitleaks.toml
      - scripts/gitleaks-selftest.py
      - scripts/tests/test_check_client_warnings.py
      - scripts/check-client-warnings.py
      - reference/manifests/**
      - modern/CMakeLists.txt
      - modern/tests/**
      - modern/third_party/googletest-src/**
      - modern/data/PlayDH/Resource/**
  push:
    branches: [codex/reorg-original-20261009]

permissions:
  contents: read

jobs:
  original_governance_and_python_tests:
    runs-on: ubuntu-latest
    container:
      image: python:3.12-alpine3.22@sha256:a190708a2dec1bd18b1decb539f8e8f5407abaa9bf39cacda583f7f8c11db322
    defaults:
      run:
        shell: sh
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      GIT_LFS_SKIP_SMUDGE: "1"
    steps:
      - name: Checkout pull request merge ref
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # 容器里没有默认的 GITHUB_TOKEN。只注入到本步环境，askpass 按变量名读取。
          # 脚本用单引号写入 "$GITHUB_TOKEN"，不展开、不 echo，日志里不会出现令牌值。
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          apk add --no-cache git ca-certificates
          git init
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          askpass=$(mktemp)
          printf '%s\n' '#!/bin/sh' 'case "$1" in' '*Username*) printf "%s\n" x-access-token ;;' '*) printf "%s\n" "$GITHUB_TOKEN" ;;' 'esac' > "$askpass"
          chmod 700 "$askpass"
          if [ -n "$PR_NUMBER" ]; then
            refspec="+refs/pull/${PR_NUMBER}/merge:refs/remotes/origin/pr"
            GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 git fetch --depth 1 origin "$refspec"
            rm -f "$askpass"
            git checkout --detach refs/remotes/origin/pr
          else
            GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 git fetch --depth 1 origin "$GITHUB_SHA"
            rm -f "$askpass"
            git checkout --detach FETCH_HEAD
          fi

      - name: original_governance_and_python_tests
        run: |
          python3 --version
          python3 scripts/check-project-governance.py
          python3 scripts/check-no-pak-changes.py
          python3 scripts/check-ps1-encoding.py
          python3 scripts/tests/test_check_client_warnings.py
          python3 -B -m unittest modern/tests/unit/tools/test_unpack_pak.py
          python3 -B -m unittest modern/tests/unit/tools/test_pak_writer.py
          python3 -B -m unittest modern/tests/unit/tools/test_check_no_pak_changes.py
          python3 -B -m unittest modern/tests/unit/tools/test_resource_profile.py
          python3 -B -m unittest modern/tests/unit/tools/test_resource_reference_gate.py
          python3 -B -m unittest modern/tests/unit/tools/test_mh_bin.py
          python3 -B -m unittest modern/tests/unit/tools/test_compat_round_trip.py
          python3 -B -m unittest modern/tests/unit/tools/test_repack_titan_bin.py

      - name: resource_reference_gate check
        if: always()
        run: |
          python3 modern/tools/resource_reference_gate.py check --manifest reference/manifests/original-resource-references.json --root modern/data/PlayDH --report ci-resource-reference-report.json --codequality ci-resource-reference-codequality.json

  original_resource_reference_warn:
    runs-on: ubuntu-latest
    container:
      image: python:3.12-alpine3.22@sha256:a190708a2dec1bd18b1decb539f8e8f5407abaa9bf39cacda583f7f8c11db322
    defaults:
      run:
        shell: sh
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      GIT_LFS_SKIP_SMUDGE: "1"
    steps:
      - name: Checkout pull request merge ref
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # 容器里没有默认的 GITHUB_TOKEN。只注入到本步环境，askpass 按变量名读取。
          # 脚本用单引号写入 "$GITHUB_TOKEN"，不展开、不 echo，日志里不会出现令牌值。
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          apk add --no-cache git ca-certificates
          git init
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          askpass=$(mktemp)
          printf '%s\n' '#!/bin/sh' 'case "$1" in' '*Username*) printf "%s\n" x-access-token ;;' '*) printf "%s\n" "$GITHUB_TOKEN" ;;' 'esac' > "$askpass"
          chmod 700 "$askpass"
          if [ -n "$PR_NUMBER" ]; then
            refspec="+refs/pull/${PR_NUMBER}/merge:refs/remotes/origin/pr"
            GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 git fetch --depth 1 origin "$refspec"
            rm -f "$askpass"
            git checkout --detach refs/remotes/origin/pr
          else
            GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 git fetch --depth 1 origin "$GITHUB_SHA"
            rm -f "$askpass"
            git checkout --detach FETCH_HEAD
          fi

      - name: original_resource_reference_warn
        run: |
          python3 -B -m unittest modern/tests/unit/tools/test_resource_reference_gate.py

      - name: resource_reference_gate check
        if: always()
        run: |
          python3 modern/tools/resource_reference_gate.py check --manifest reference/manifests/original-resource-references.json --root modern/data/PlayDH --report ci-resource-reference-report.json --codequality ci-resource-reference-codequality.json

  rog_gate_self_test:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/devcontainers/base:2.1.8-ubuntu24.04@sha256:f5a2cf592fd194be54fff4fc8e24388bd7d6b496f4653de7a4e985f41e8dc188
    env:
      GIT_LFS_SKIP_SMUDGE: "1"
    steps:
      - name: Checkout pull request merge ref
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # 容器里没有默认的 GITHUB_TOKEN。只注入到本步环境，askpass 按变量名读取。
          # 脚本用单引号写入 "$GITHUB_TOKEN"，不展开、不 echo，日志里不会出现令牌值。
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git init
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          askpass=$(mktemp)
          printf '%s\n' '#!/bin/sh' 'case "$1" in' '*Username*) printf "%s\n" x-access-token ;;' '*) printf "%s\n" "$GITHUB_TOKEN" ;;' 'esac' > "$askpass"
          chmod 700 "$askpass"
          if [ -n "$PR_NUMBER" ]; then
            refspec="+refs/pull/${PR_NUMBER}/merge:refs/remotes/origin/pr"
            GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 git fetch --depth 1 origin "$refspec"
            rm -f "$askpass"
            git checkout --detach refs/remotes/origin/pr
          else
            GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 git fetch --depth 1 origin "$GITHUB_SHA"
            rm -f "$askpass"
            git checkout --detach FETCH_HEAD
          fi

      - name: rog_gate_self_test
        run: |
          set -eu
          pwsh_dir="$(mktemp -d)"
          pwsh_tarball="${pwsh_dir}/powershell-7.6.9-linux-x64.tar.gz"
          curl -fsSL -o "${pwsh_tarball}" "https://github.com/PowerShell/PowerShell/releases/download/v7.6.9/powershell-7.6.9-linux-x64.tar.gz"
          echo "1da6d6d6035d651f20e70ddee7c4c15ac6ab8b9fb40ee92240d91263f28a884b  ${pwsh_tarball}" | sha256sum -c -
          tar -xzf "${pwsh_tarball}" -C "${pwsh_dir}"
          export PATH="${pwsh_dir}:${PATH}"
          export DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1
          pwsh -NoProfile -File scripts/rog-gate-build.ps1 -SelfTest
          pwsh -NoProfile -File scripts/rog-gate-build.ps1 -SelfTest -SelfTestNoLinks
          pwsh -NoProfile -File scripts/tests/test-commercial-smoke-mssql-e2e.ps1
          pwsh -NoProfile -File scripts/tests/test-gui-client-smoke-ephemeral.ps1
          pwsh -NoProfile -File scripts/tests/test-deploy-default-map.ps1
          pwsh -NoProfile -File scripts/tests/test-soak-24h.ps1
          pwsh -NoProfile -File scripts/tests/test-forbidden-rog-ports.ps1
          pwsh -NoProfile -File deploy/scripts/deploy_client.ps1 -SelfTest
          pwsh -NoProfile -File deploy/scripts/deploy_server.ps1 -SelfTest
          pwsh -NoProfile -File scripts/tests/test-deploy-client-playdh-root.ps1

  cxx_resource_reference_linux:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/devcontainers/base:2.1.8-ubuntu24.04@sha256:f5a2cf592fd194be54fff4fc8e24388bd7d6b496f4653de7a4e985f41e8dc188
    env:
      GIT_LFS_SKIP_SMUDGE: "1"
    steps:
      - name: Checkout pull request merge ref
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # 容器里没有默认的 GITHUB_TOKEN。只注入到本步环境，askpass 按变量名读取。
          # 脚本用单引号写入 "$GITHUB_TOKEN"，不展开、不 echo，日志里不会出现令牌值。
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git init
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          askpass=$(mktemp)
          printf '%s\n' '#!/bin/sh' 'case "$1" in' '*Username*) printf "%s\n" x-access-token ;;' '*) printf "%s\n" "$GITHUB_TOKEN" ;;' 'esac' > "$askpass"
          chmod 700 "$askpass"
          if [ -n "$PR_NUMBER" ]; then
            refspec="+refs/pull/${PR_NUMBER}/merge:refs/remotes/origin/pr"
            GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 git fetch --depth 1 origin "$refspec"
            rm -f "$askpass"
            git checkout --detach refs/remotes/origin/pr
          else
            GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 git fetch --depth 1 origin "$GITHUB_SHA"
            rm -f "$askpass"
            git checkout --detach FETCH_HEAD
          fi

      - name: Install build tools
        run: |
          set -eu
          if [ "$(id -u)" -eq 0 ]; then
            apt_get() { DEBIAN_FRONTEND=noninteractive apt-get "$@"; }
          else
            apt_get() { sudo DEBIAN_FRONTEND=noninteractive apt-get "$@"; }
          fi
          apt_get update
          apt_get install -y --no-install-recommends build-essential cmake ninja-build python3 git ca-certificates

      - name: Configure and build mxh_resource_reference_tests
        run: |
          set -eu
          cmake --version
          cmake -S modern -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build build --target mxh_resource_reference_tests mxh_agent_cli_tests mxh_e2e_soak_tests mxh_dpi_scale_tests mxh_session_retry_contract_tests mxh_audio_contract_tests mxh_item_protocol_tests mxh_protocol_hash_tests mxh_login_protocol_gate_tests mxh_playdh_env_tests mxh_ingame_playdh_root_tests mxh_pack_file_header_tests

      - name: Run MxhResourceReference ctest
        run: |
          # Container jobs default to sh (dash). dash rejects `set -o pipefail`,
          # so ctest runs under bash and a failing ctest still fails the step.
          bash -euo pipefail <<'EOF'
          ctest --test-dir build -R '^(MxhResourceReference\.|AgentCli\.|DpiScale\.|SessionRetryContract\.|AudioContract\.|ItemProtocol\.|E2eSoak|ProtocolHash\.|LoginProtocolGate\.|PlayDhRootRequired\.|InGamePlayDhRoot\.|PackFileHeader\.SyntheticNpcPetTitanArchivesRoundTrip)' --output-on-failure 2>&1 | tee ctest.log
          EOF

      - name: Require PlayDH reference tests passed
        if: always()
        run: |
          set -eu
          test -s ctest.log
          require_passed() {
            name="$1"
            if grep -F "$name" ctest.log | grep -Eq 'Skipped|Not Run'; then
              echo "CXX_RESOURCE_REFERENCE REQUIRED NOT PASSED ${name}" >&2
              return 1
            fi
            if grep -F "$name" ctest.log | grep -Eq '(^|[[:space:]])Passed([[:space:]]|$)'; then
              echo "CXX_RESOURCE_REFERENCE REQUIRED PASSED ${name}"
              return 0
            fi
            echo "CXX_RESOURCE_REFERENCE REQUIRED NOT PASSED ${name}" >&2
            return 1
          }
          status=0
          require_passed MxhResourceReference.PlayDhFilesMatchReferenceManifest || status=1
          require_passed MxhResourceReference.PlayDhServerArchiveFilesMatchReferenceManifest || status=1
          require_passed MxhResourceReference.SyntheticFixtureCompareLoopDetectsMatchAndMismatches || status=1
          require_passed PackFileHeader.SyntheticNpcPetTitanArchivesRoundTrip || status=1
          require_passed AgentCli.OmittedDefaultMapIs17 || status=1

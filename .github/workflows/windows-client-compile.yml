# Compile-check the Windows game client (mxh_client / MoxianClient).
# pull_request (not pull_request_target) plus workflow_dispatch.
# This is not a required check. contents: read only. No secrets.
#
# actions/checkout for pull_request checks out the PR merge ref. Do not
# override ref. lfs is false, and GIT_LFS_SKIP_SMUDGE stays set, so the
# four LFS .pak archives stay pointer files.
#
# Sparse checkout omits the three PlayDH archives that are already real
# binaries in git (Pet.pak, npc.pak, Titan.pak). A full checkout would
# fail the pak gate on those blobs. The four LFS archives are checked
# out as pointers and the gate fails if any workspace .pak is a binary.
#
# The mxh_client build stays compile-only: -DMXH_CLIENT_COMPILE_ONLY=ON,
# Debug / Win32 / MSVC, stop at mxh_client. That log is the only input to
# MXH_CLIENT_WARNINGS. MXH_PLAYDH_ROOT is never set.
#
# MapHandlerTest and InGamePlayable behavior tests link mxh_server and
# mxh_client_lib, so they are not in the compile-only closure. A second
# directory, build-behavior, is configured with MXH_CLIENT_COMPILE_ONLY=OFF.
# Extension point: append one line to ci/windows_behavior_tests.txt
# (`Name` or `Name ok=<N>`, default N=1). That file is the only test list.
# ctest -R and require_passed both read it via ci/windows_behavior_require.ps1.
# Passed is not enough: the checker also requires N `[       OK ]` lines and
# rejects `[  PASSED  ] 0 tests`, `0 tests from`, `[  SKIPPED ]`, and DISABLED_.
# Append a CMake target inside $behaviorTargets. One cmake --build --target
# invocation builds every name; a missing or failed target fails the step.
# Behavior tests must not use ROG ports 26001/27001/28001 and must stay on
# this runner's workspace and RUNNER_TEMP.
# The raw ctest -V log is uploaded as windows-behavior-ctest-log.
# Those cases call MapHandler and
# CInGameState::Init(nullptr) / on_message. They do not call
# Device::createSwapChain, which is the only D3D11CreateDeviceAndSwapChain
# site. A device-creation failure is a job failure, not a skip.

name: windows-client-compile

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/windows-client-compile.yml
      - ci/windows_behavior_tests.txt
      - ci/windows_behavior_require.ps1
      - scripts/protocol_manifest_gate.ps1
      - modern/CMakeLists.txt
      - modern/src/CMakeLists.txt
      - modern/tools/MoxianClient/**
      - modern/src/client/**
      - modern/src/ui/**
      - modern/src/render/**
      - modern/src/audio/**
      - modern/src/log/**
      - modern/src/net/**
      - modern/src/crypto/**
      - modern/src/game/**
      - modern/src/monitor/**
      - modern/src/services/**
      - modern/src/anm_motion.cpp
      - modern/src/bmhm_map.cpp
      - modern/src/bsad_area.cpp
      - modern/src/character_appearance_catalog.cpp
      - modern/src/chr_motion.cpp
      - modern/src/chx_model.cpp
      - modern/src/gx_map_script.cpp
      - modern/src/hfl_height_field.cpp
      - modern/src/image_path_table.cpp
      - modern/src/item_effects.cpp
      - modern/src/map_change_catalog.cpp
      - modern/src/mh_file_ex.cpp
      - modern/src/monster_catalog.cpp
      - modern/src/npc_chx_catalog.cpp
      - modern/src/pack_file.cpp
      - modern/src/quest_npc_catalog.cpp
      - modern/src/quest_string_catalog.cpp
      - modern/src/sound_list.cpp
      - modern/src/stm_static_model.cpp
      - modern/src/ttb_tile_table.cpp
      - modern/include/mxh/audio/**
      - modern/include/mxh/client/**
      - modern/include/mxh/compat/**
      - modern/include/mxh/crypto/**
      - modern/include/mxh/game/**
      - modern/include/mxh/log/**
      - modern/include/mxh/monitor/**
      - modern/include/mxh/net/**
      - modern/include/mxh/proto/**
      - modern/include/mxh/render/**
      - modern/include/mxh/services/**
      - modern/include/mxh/ui/**
      - modern/include/mxh/server/**
      - modern/src/server/**
      - modern/tests/unit/client/**
      - modern/tests/unit/server/**
      - modern/tests/unit/pack_file_header_test.cpp
      - scripts/playdh_baseline_check.py
      - scripts/playdh_external_only.py
      - reference/manifests/playdh-external-only.txt
      - modern/data/PlayDH/Resource/CharacterExpPoint.bin

permissions:
  contents: read

jobs:
  mxh_client:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      GIT_LFS_SKIP_SMUDGE: "1"
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout pull request merge ref
        uses: actions/checkout@v4
        with:
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            modern/CMakeLists.txt
            modern/src
            modern/include
            modern/tools/MoxianClient
            ci/windows_behavior_tests.txt
            ci/windows_behavior_require.ps1
            scripts/protocol_manifest_gate.ps1
            modern/third_party/sqlite
            modern/third_party/googletest-src
            modern/tests
            modern/tools/MoxianResourceExplorer
            modern/tools/MoxianDbTool
            modern/tools/MoxianLoginServer
            modern/tools/MoxianAgentServer
            modern/tools/MoxianMapServer
            modern/tools/MoxianClientE2E
            modern/tools/MoxianRenderDemo
            modern/tools/MoxianPacker
            modern/tools/MoxianGMTool
            modern/tools/MoxianMapEditor
            modern/tools/MoxianAutoPatcher
            modern/tools/MoxianLauncher
            modern/tools/MoxianProtocolDoc
            modern/tools/MoxianSideBySide
            modern/tools/dialog_children_type_scan
            modern/tools/MoxianPortal
            modern/tools/MxDumpInspect
            modern/data/PlayDH/Map.pak
            modern/data/PlayDH/Character.pak
            modern/data/PlayDH/Effect.pak
            modern/data/PlayDH/monster.pak
            deploy/scripts/deploy_client.ps1
            deploy/scripts/deploy_server.ps1
            deploy/scripts/playdh_package_guard.ps1
            deploy/resource-profiles.json
            modern/config/resource-profiles/playdh-current.json
            scripts/tests/test-deploy-client-playdh-root.ps1

      # Standalone. Does not read the build tree or share state with a ctest step.
      - name: Exercise PowerShell item protocol gate
        run: |
          $ErrorActionPreference = 'Stop'
          # Assert-MxhItemProtocolMatch calls exit 1. A child process is required
          # so that mismatch does not end this step before the other cases run.
          $PSNativeCommandUseErrorActionPreference = $false
          $gate = Join-Path (Get-Location) 'scripts\protocol_manifest_gate.ps1'
          if (-not (Test-Path -LiteralPath $gate -PathType Leaf)) {
            throw "protocol gate script is not in the checkout: $gate"
          }
          $tempParent = if ([string]::IsNullOrWhiteSpace($env:RUNNER_TEMP)) {
            [System.IO.Path]::GetTempPath()
          } else {
            $env:RUNNER_TEMP
          }
          $temp = Join-Path $tempParent ('mxh-ps-gate-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $temp | Out-Null
          try {
            $hashA = 'a' * 64
            $hashB = 'b' * 64

            function New-MxhGateSide {
              param(
                [Parameter(Mandatory)][string]$Name,
                [Parameter(Mandatory)][string]$Hash
              )
              $dir = Join-Path $temp $Name
              New-Item -ItemType Directory -Path $dir | Out-Null
              $exe = Join-Path $dir 'side.exe'
              [System.IO.File]::WriteAllBytes($exe, (New-Object byte[] 1))
              $manifest = Join-Path $dir 'protocol.manifest'
              [System.IO.File]::WriteAllText($manifest, "item_protocol_sha256=$Hash`n")
              return $exe
            }

            function Invoke-MxhGateCase {
              param(
                [Parameter(Mandatory)][string]$Name,
                [Parameter(Mandatory)][string]$MapExecutable,
                [Parameter(Mandatory)][string]$ClientExecutable,
                [Parameter(Mandatory)][bool]$ExpectZero,
                [Parameter(Mandatory)][string]$ExpectText
              )
              $command = ". '" + $gate.Replace("'", "''") + "'; Assert-MxhItemProtocolMatch -MapExecutable '" + $MapExecutable.Replace("'", "''") + "' -ClientExecutable '" + $ClientExecutable.Replace("'", "''") + "'"
              $output = & pwsh -NoProfile -Command $command 2>&1 | Out-String
              $code = $LASTEXITCODE
              $textOk = $output.Contains($ExpectText)
              $exitOk = if ($ExpectZero) { $code -eq 0 } else { $code -ne 0 }
              if (-not $textOk -or -not $exitOk) {
                Write-Host "PS_GATE_CASE $Name exit=$code FAIL"
                Write-Host $output
                throw "protocol gate case ${Name} failed (exit=$code expectZero=$ExpectZero text=$ExpectText)"
              }
              Write-Host "PS_GATE_CASE $Name exit=$code OK"
            }

            $mapMatch = New-MxhGateSide -Name 'map-match' -Hash $hashA
            $clientMatch = New-MxhGateSide -Name 'client-match' -Hash $hashA
            Invoke-MxhGateCase -Name 'match' -MapExecutable $mapMatch -ClientExecutable $clientMatch -ExpectZero $true -ExpectText "PROTOCOL_MATCH item=$hashA"

            $mapDiff = New-MxhGateSide -Name 'map-diff' -Hash $hashA
            $clientDiff = New-MxhGateSide -Name 'client-diff' -Hash $hashB
            Invoke-MxhGateCase -Name 'mismatch' -MapExecutable $mapDiff -ClientExecutable $clientDiff -ExpectZero $false -ExpectText "PROTOCOL_MISMATCH item=$hashA/$hashB"

            $clientOnly = New-MxhGateSide -Name 'client-only' -Hash $hashB
            $missingMap = Join-Path $temp 'absent-map\side.exe'
            Invoke-MxhGateCase -Name 'server-missing' -MapExecutable $missingMap -ClientExecutable $clientOnly -ExpectZero $false -ExpectText "PROTOCOL_MISMATCH item=missing/$hashB"

            $mapOnly = New-MxhGateSide -Name 'map-only' -Hash $hashA
            $missingClient = Join-Path $temp 'absent-client\side.exe'
            Invoke-MxhGateCase -Name 'client-missing' -MapExecutable $mapOnly -ClientExecutable $missingClient -ExpectZero $false -ExpectText "PROTOCOL_MISMATCH item=$hashA/missing"

            $missingBothMap = Join-Path $temp 'absent-both-map\side.exe'
            $missingBothClient = Join-Path $temp 'absent-both-client\side.exe'
            Invoke-MxhGateCase -Name 'both-missing' -MapExecutable $missingBothMap -ClientExecutable $missingBothClient -ExpectZero $false -ExpectText 'PROTOCOL_MISMATCH item=missing/missing'
          } finally {
            if (Test-Path -LiteralPath $temp) {
              Remove-Item -LiteralPath $temp -Recurse -Force
            }
          }
          # The last child pwsh exits 1. pwsh -Command keeps that code unless cleared.
          $global:LASTEXITCODE = 0
          exit 0

      # Canned ctest logs. Same checker as the real require_passed step.
      - name: Self-test behavior require_passed
        run: |
          $ErrorActionPreference = 'Stop'
          $checker = Join-Path (Get-Location) 'ci\windows_behavior_require.ps1'
          if (-not (Test-Path -LiteralPath $checker -PathType Leaf)) {
            throw "behavior require checker is missing: $checker"
          }
          . $checker
          Invoke-MxhBehaviorRequireSelfTest

      - name: Prove no pak binary was checked out
        run: |
          $ErrorActionPreference = 'Stop'
          $root = (Get-Location).Path
          $paks = @(Get-ChildItem -LiteralPath $root -Recurse -File -Filter *.pak -Force -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch '[\\/]\.git([\\/]|$)' })
          $pointerCount = 0
          $binaries = New-Object System.Collections.Generic.List[string]
          foreach ($pak in $paks) {
            $fs = [System.IO.File]::Open($pak.FullName, [System.IO.FileMode]::Open, [System.IO.FileAccess]::Read, [System.IO.FileShare]::Read)
            try {
              $buf = New-Object byte[] 64
              $n = $fs.Read($buf, 0, $buf.Length)
            } finally {
              $fs.Dispose()
            }
            $text = [System.Text.Encoding]::ASCII.GetString($buf, 0, [Math]::Max($n, 0))
            $rel = $pak.FullName.Substring($root.Length).TrimStart('\')
            Write-Host ("PAK {0} bytes={1}" -f $rel, $pak.Length)
            if ($text.StartsWith('version https://git-lfs.github.com/spec/v1')) {
              $pointerCount++
            } else {
              $binaries.Add($rel) | Out-Null
            }
          }
          if ($binaries.Count -gt 0) {
            foreach ($rel in $binaries) { Write-Host "PAK_BINARY $rel" }
            throw 'pak binary content is present'
          }
          Write-Host "NO_PAK_CONTENT OK count=$pointerCount pointer files"

      - name: Configure mxh_client without PlayDH
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path Env:MXH_PLAYDH_ROOT) { Remove-Item Env:MXH_PLAYDH_ROOT }
          if (-not [string]::IsNullOrEmpty($env:MXH_PLAYDH_ROOT)) {
            throw 'MXH_PLAYDH_ROOT is set'
          }
          cmake --version
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere)) { throw "vswhere.exe was not found at $vswhere" }
          $installVersion = @( & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationVersion )
          if ($installVersion.Count -lt 1 -or [string]::IsNullOrWhiteSpace($installVersion[0])) {
            throw 'windows-latest has no VC Tools instance'
          }
          $major = [int](($installVersion[0] -split '\.')[0])
          $generator = switch ($major) {
            17 { 'Visual Studio 17 2022' }
            18 { 'Visual Studio 18 2026' }
            default { throw "unsupported Visual Studio $major ($($installVersion[0]))" }
          }
          Write-Host "VS $($installVersion[0]) generator=$generator arch=Win32"
          cmake -S modern -B build -G $generator -A Win32 -DMXH_CLIENT_COMPILE_ONLY=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $cache = Join-Path (Get-Location) 'build\CMakeCache.txt'
          $playdh = Select-String -LiteralPath $cache -Pattern 'MXH_PLAYDH' -SimpleMatch
          if ($playdh) {
            $playdh | ForEach-Object { Write-Host $_.Line }
            throw 'CMake cache contains MXH_PLAYDH'
          }
          Select-String -LiteralPath $cache -Pattern 'CMAKE_GENERATOR:|CMAKE_GENERATOR_PLATFORM:|MXH_CLIENT_COMPILE_ONLY:' |
            ForEach-Object { Write-Host $_.Line }

      - name: Build mxh_client Debug
        run: |
          $ErrorActionPreference = 'Stop'
          $log = Join-Path $env:RUNNER_TEMP 'mxh_client-build.log'
          cmd /c "cmake --build build --config Debug --target mxh_client --clean-first -- /m /nologo /v:normal > `"$log`" 2>&1"
          $buildExit = $LASTEXITCODE
          Get-Content -LiteralPath $log
          $seen = [System.Collections.Generic.HashSet[string]]::new([StringComparer]::Ordinal)
          $warningCount = 0
          foreach ($line in [System.IO.File]::ReadLines($log)) {
            if ($line -match 'warning (C\d+|LNK\d+)') {
              if ($seen.Add($line)) { $warningCount++ }
            }
          }
          Write-Host "MXH_CLIENT_WARNINGS=$warningCount"
          if ($buildExit -ne 0) {
            Write-Host '----- compiler errors -----'
            foreach ($line in [System.IO.File]::ReadLines($log)) {
              if ($line -match 'error (C\d+|LNK\d+)') { Write-Host $line }
            }
            exit $buildExit
          }

      - name: Check embedded manifest
        run: |
          $ErrorActionPreference = 'Stop'
          $roots = @(
            (Join-Path (Get-Location) 'modern\tools\MoxianClient'),
            (Join-Path (Get-Location) 'modern\src\client')
          )
          $files = @()
          foreach ($root in $roots) {
            if (-not (Test-Path -LiteralPath $root)) { continue }
            $files += @(Get-ChildItem -LiteralPath $root -Recurse -File -ErrorAction SilentlyContinue |
              Where-Object { $_.Extension -eq '.manifest' -or $_.Name -eq 'mxh_client.manifest' })
          }
          $declares = $false
          foreach ($file in $files) {
            $text = [System.IO.File]::ReadAllText($file.FullName)
            Write-Host "MANIFEST_SOURCE $($file.FullName)"
            if ($text.Contains('PerMonitorV2')) { $declares = $true }
          }
          if (-not $declares) {
            Write-Host 'MANIFEST_CHECK SKIPPED (no mxh_client.manifest)'
            exit 0
          }
          $exe = Get-ChildItem -LiteralPath (Join-Path (Get-Location) 'build') -Recurse -File -Filter mxh_client.exe |
            Where-Object { $_.Directory.Name -eq 'Debug' } |
            Select-Object -First 1
          if ($null -eq $exe) { throw 'mxh_client.exe was not produced' }
          $kitRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
          $mt = @(Get-ChildItem -LiteralPath $kitRoot -Recurse -File -Filter mt.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.Directory.Name -eq 'x64' } |
            Sort-Object {
              $versionText = '0.0.0.0'
              if ($_.FullName -match '\\([0-9]+\.[0-9]+\.[0-9]+\.[0-9]+)\\x64\\mt\.exe$') {
                $versionText = $Matches[1]
              }
              [version]$versionText
            } -Descending)
          if ($mt.Count -lt 1) { throw 'mt.exe was not found under Windows Kits\10\bin\*\x64' }
          Write-Host "MT $($mt[0].FullName)"
          Write-Host "EXE $($exe.FullName)"
          $out = Join-Path $env:RUNNER_TEMP 'mxh_client-manifest.xml'
          & $mt[0].FullName -nologo "-inputresource:$($exe.FullName);#1" "-out:$out"
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $out)) {
            throw "mt.exe failed to export the embedded manifest (exit $LASTEXITCODE)"
          }
          Write-Host '----- embedded manifest -----'
          Get-Content -LiteralPath $out
          Write-Host '----- end manifest -----'
          $exported = [System.IO.File]::ReadAllText($out)
          if (-not $exported.Contains('PerMonitorV2')) {
            throw 'embedded manifest does not contain PerMonitorV2'
          }
          Write-Host 'MANIFEST_CHECK PerMonitorV2 OK'

      - name: Configure behavior tests without PlayDH
        run: |
          $ErrorActionPreference = 'Stop'
          # Reject sparse-checkout paths under modern/data/PlayDH/Resource/ before
          # this step configures or builds. The self-test uses an in-memory list.
          function Get-MxhSparseResourceViolations {
            param([string[]]$Paths)
            $prefix = 'modern/data/PlayDH/Resource/'
            $failures = [System.Collections.Generic.List[string]]::new()
            foreach ($raw in $Paths) {
              if ([string]::IsNullOrWhiteSpace($raw)) { continue }
              $path = ($raw.Trim() -replace '\\','/')
              if ($path.StartsWith('/')) { $path = $path.TrimStart('/') }
              if ($path.StartsWith($prefix)) { $failures.Add($path) }
            }
            # -NoEnumerate keeps a 0- or 1-element list from becoming $null or a string.
            Write-Output $failures -NoEnumerate
          }
          $probe = Get-MxhSparseResourceViolations -Paths @(
            'modern/src/game/experience_curve.cpp',
            'modern/data/PlayDH/Resource/SyntheticProbe.bin',
            'modern/data/PlayDH/Map.pak')
          if ($probe.Count -ne 1 -or $probe[0] -ne 'modern/data/PlayDH/Resource/SyntheticProbe.bin') {
            throw "SPARSE_RESOURCE_SELFTEST expected the synthetic Resource path to fail, got: $($probe -join ' | ')"
          }
          $clean = Get-MxhSparseResourceViolations -Paths @(
            'modern/src/game/experience_curve.cpp',
            'modern/data/PlayDH/Map.pak')
          if ($clean.Count -ne 0) {
            throw "SPARSE_RESOURCE_SELFTEST expected a non-Resource list to pass, got: $($clean -join ' | ')"
          }
          Write-Host 'SPARSE_RESOURCE_SELFTEST OK'
          $PSNativeCommandUseErrorActionPreference = $false
          $listed = @(git sparse-checkout list)
          if ($LASTEXITCODE -ne 0) { throw "git sparse-checkout list failed ($LASTEXITCODE)" }
          $violations = Get-MxhSparseResourceViolations -Paths $listed
          if ($violations.Count -gt 0) {
            foreach ($path in $violations) { Write-Host "SPARSE_RESOURCE_CHECK FAIL $path" }
            exit 1
          }
          Write-Host 'SPARSE_RESOURCE_CHECK OK'
          if (Test-Path Env:MXH_PLAYDH_ROOT) { Remove-Item Env:MXH_PLAYDH_ROOT }
          if (-not [string]::IsNullOrEmpty($env:MXH_PLAYDH_ROOT)) {
            throw 'MXH_PLAYDH_ROOT is set'
          }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere)) { throw "vswhere.exe was not found at $vswhere" }
          $installVersion = @( & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationVersion )
          if ($installVersion.Count -lt 1 -or [string]::IsNullOrWhiteSpace($installVersion[0])) {
            throw 'windows-latest has no VC Tools instance'
          }
          $major = [int](($installVersion[0] -split '\.')[0])
          $generator = switch ($major) {
            17 { 'Visual Studio 17 2022' }
            18 { 'Visual Studio 18 2026' }
            default { throw "unsupported Visual Studio $major ($($installVersion[0]))" }
          }
          Write-Host "VS $($installVersion[0]) generator=$generator arch=Win32 behavior=OFF"
          cmake -S modern -B build-behavior -G $generator -A Win32 -DMXH_CLIENT_COMPILE_ONLY=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $cache = Join-Path (Get-Location) 'build-behavior\CMakeCache.txt'
          $playdh = Select-String -LiteralPath $cache -Pattern 'MXH_PLAYDH' -SimpleMatch
          if ($playdh) {
            $playdh | ForEach-Object { Write-Host $_.Line }
            throw 'behavior CMake cache contains MXH_PLAYDH'
          }
          $compileOnly = Select-String -LiteralPath $cache -Pattern '^MXH_CLIENT_COMPILE_ONLY:BOOL=ON$'
          if ($compileOnly) { throw 'behavior configure left MXH_CLIENT_COMPILE_ONLY ON' }
          Select-String -LiteralPath $cache -Pattern 'CMAKE_GENERATOR:|CMAKE_GENERATOR_PLATFORM:|MXH_CLIENT_COMPILE_ONLY:' |
            ForEach-Object { Write-Host $_.Line }

      # Extension point: $behaviorTargets is the only target list. Test names
      # live only in ci/windows_behavior_tests.txt (optional ok=<N>, default 1).
      - name: Build behavior test targets
        run: |
          $ErrorActionPreference = 'Stop'
          # Append follow-up CMake targets here, one quoted name per line.
          # The single cmake --build --target invocation below builds every
          # name, and the same ctest -R runs the names from the list file.
          # A target that is not in this build, or that fails to compile,
          # fails this step. Do not use ROG ports 26001, 27001, or 28001.
          # Tests may use only this runner's workspace checkout and RUNNER_TEMP.
          $behaviorTargets = @(
            'mxh_server_handler_tests',
            'mxh_client_tests',
            'mxh_login_e2e_tests',
            'mxh_login_wire_sha256_tests',
            'mxh_agent_wire_first_packet_tests'
            # append targets here
          )
          if ($behaviorTargets.Count -lt 1) { throw 'behavior target list is empty' }
          $buildRoot = Join-Path (Get-Location) 'build-behavior'
          $seen = [System.Collections.Generic.HashSet[string]]::new([StringComparer]::Ordinal)
          foreach ($target in $behaviorTargets) {
            if ([string]::IsNullOrWhiteSpace($target)) { throw 'behavior target name is empty' }
            if (-not $seen.Add($target)) { throw "behavior target is listed twice: $target" }
            $proj = @(Get-ChildItem -LiteralPath $buildRoot -Recurse -File -Filter ($target + '.vcxproj') -ErrorAction SilentlyContinue)
            if ($proj.Count -lt 1) { throw "behavior target is not in the build: $target" }
            Write-Host "BEHAVIOR_TARGET $target"
          }
          & cmake --build build-behavior --config Debug --target @behaviorTargets -- /m /nologo
          if ($LASTEXITCODE -ne 0) {
            throw "behavior target build failed ($LASTEXITCODE): $($behaviorTargets -join ' ')"
          }
          foreach ($target in $behaviorTargets) {
            $exe = @(Get-ChildItem -LiteralPath $buildRoot -Recurse -File -Filter ($target + '.exe') -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '\\Debug\\' })
            if ($exe.Count -lt 1) { throw "behavior target produced no Debug executable: $target" }
            Write-Host "BEHAVIOR_EXE $($exe[0].FullName)"
          }

      - name: Run listed behavior tests
        run: |
          $ErrorActionPreference = 'Stop'
          $log = Join-Path (Get-Location) 'behavior-ctest.log'
          $stdout = Join-Path (Get-Location) 'behavior-ctest.stdout'
          $stderr = Join-Path (Get-Location) 'behavior-ctest.err'
          $list = Join-Path (Get-Location) 'ci\windows_behavior_tests.txt'
          $checker = Join-Path (Get-Location) 'ci\windows_behavior_require.ps1'
          if (-not (Test-Path -LiteralPath $list -PathType Leaf)) {
            throw "behavior test list is missing: $list"
          }
          . $checker
          $entries = @(Get-MxhBehaviorEntries -ListPath $list)
          if ($entries.Count -lt 1) { throw 'behavior test list has no test names' }
          $escaped = foreach ($entry in $entries) { [regex]::Escape($entry.Name) }
          $regex = '^(' + ($escaped -join '|') + ')$'
          Write-Host "CTEST_REGEX $regex"
          foreach ($entry in $entries) { Write-Host "CTEST_LIST $($entry.Name) ok=$($entry.ExpectedOk)" }
          $ctestArgs = @(
            '--test-dir', 'build-behavior',
            '-C', 'Debug',
            '--output-on-failure',
            '-V',
            '--output-log', $log,
            '--no-tests=error',
            '--timeout', '180',
            '-R', $regex
          )
          $proc = Start-Process -FilePath 'ctest' -ArgumentList $ctestArgs -Wait -PassThru `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if (-not (Test-Path -LiteralPath $log) -or (Get-Item -LiteralPath $log).Length -eq 0) {
            if (Test-Path -LiteralPath $stdout) {
              Copy-Item -LiteralPath $stdout -Destination $log -Force
            }
          }
          if (Test-Path -LiteralPath $log) {
            Get-Content -LiteralPath $log
            foreach ($port in 26001, 27001, 28001) {
              $hit = Select-String -LiteralPath $log -Pattern ('\b' + $port + '\b') -Quiet
              if ($hit) { throw "behavior test used ROG port $port" }
            }
          }
          exit $proc.ExitCode

      - name: Require listed behavior tests passed
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          $log = Join-Path (Get-Location) 'behavior-ctest.log'
          $list = Join-Path (Get-Location) 'ci\windows_behavior_tests.txt'
          $checker = Join-Path (Get-Location) 'ci\windows_behavior_require.ps1'
          . $checker
          if (-not (Test-Path -LiteralPath $list -PathType Leaf)) {
            Write-Host 'REQUIRED NOT PASSED ci/windows_behavior_tests.txt ok=0/1 reason=missing'
            Write-Host 'REQUIRED SUMMARY passed=0 not_passed=1'
            exit 1
          }
          $entries = @(Get-MxhBehaviorEntries -ListPath $list)
          $logText = ''
          if (Test-Path -LiteralPath $log) {
            $logText = [System.IO.File]::ReadAllText($log)
          }
          $result = Invoke-MxhBehaviorRequire -LogText $logText -Entries $entries
          foreach ($line in $result.Lines) { Write-Host $line }
          exit $result.ExitCode

      # CanonicalMonster10BinSpawnsAllGroups is labeled rog. Listing it and
      # rerunning the required names with -LE rog must keep that case out
      # even when the regex names it. MXH_PLAYDH_ROOT stays unset.
      - name: Show rog label and rerun required tests without it
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path Env:MXH_PLAYDH_ROOT) { Remove-Item Env:MXH_PLAYDH_ROOT }
          $listed = & ctest --test-dir build-behavior -C Debug -N -L rog | Out-String
          Write-Host $listed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($listed -notmatch 'MapHandlerTest\.CanonicalMonster10BinSpawnsAllGroups') {
            throw 'rog label did not register CanonicalMonster10BinSpawnsAllGroups'
          }
          $list = Join-Path (Get-Location) 'ci\windows_behavior_tests.txt'
          . (Join-Path (Get-Location) 'ci\windows_behavior_require.ps1')
          $entries = @(Get-MxhBehaviorEntries -ListPath $list)
          $escaped = foreach ($entry in $entries) { [regex]::Escape($entry.Name) }
          $escaped += [regex]::Escape('MapHandlerTest.CanonicalMonster10BinSpawnsAllGroups')
          $regex = '^(' + ($escaped -join '|') + ')$'
          & ctest --test-dir build-behavior -C Debug --output-on-failure -LE rog `
            --no-tests=error --timeout 180 -R "$regex"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: PlayDH root is required for deploy_client
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          pwsh -NoProfile -File scripts/tests/test-deploy-client-playdh-root.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Not part of the 84-name behavior list. MoxianClientE2E itself is
      # not selected here, so this job does not read MXH_SMOKE_PASSWORD.
      # DumpCli is offline and has no password. PasswordRequired must
      # exit 3; the cmake script is the only check. This step is after
      # the behavior gate so a failure here still leaves REQUIRED SUMMARY
      # in the log.
      - name: Build mxh_client_e2e and run password ctests
        run: |
          $ErrorActionPreference = 'Stop'
          & cmake --build build-behavior --config Debug --target mxh_client_e2e -- /m /nologo
          if ($LASTEXITCODE -ne 0) { throw "mxh_client_e2e build failed ($LASTEXITCODE)" }
          $log = Join-Path (Get-Location) 'e2e-password-ctest.log'
          & ctest --test-dir build-behavior -C Debug --output-on-failure -V `
            --output-log $log --no-tests=error --timeout 30 `
            -R '^(MoxianClientE2EPasswordRequired|MoxianClientE2EDumpCli)$'
          $code = $LASTEXITCODE
          if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log }
          if ($code -ne 0) { exit $code }

      - name: Upload behavior ctest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-behavior-ctest-log
          path: behavior-ctest.log
          if-no-files-found: warn
